<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificar Membresía</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .caja { background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.2); width: 100%; max-width: 440px; padding: 28px; }
  h1 { font-size: 22px; margin: 0 0 4px; text-align: center; color: #1f2937; }
  .sub { text-align: center; color: #6b7280; font-size: 14px; margin: 0 0 20px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; font-size: 18px; padding: 12px 14px; border: 2px solid #d1d5db; border-radius: 10px; outline: none; min-width: 0; }
  input:focus { border-color: #2a5298; }
  button { font-size: 16px; font-weight: 600; padding: 12px 18px; border: 0; border-radius: 10px; background: #2a5298; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .cargando, .error, .resultado { display: none; margin-top: 20px; }
  .cargando { text-align: center; color: #6b7280; }
  .spinner { width: 32px; height: 32px; border: 4px solid #e5e7eb; border-top-color: #2a5298; border-radius: 50%; margin: 0 auto 8px; animation: g 1s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  .error { background: #fff3cd; color: #664d03; border-radius: 10px; padding: 12px 14px; font-size: 14px; }
  .resultado { border-radius: 14px; padding: 20px; text-align: center; }
  .resultado.si { background: #d1e7dd; border: 2px solid #198754; }
  .resultado.no { background: #f8d7da; border: 2px solid #dc3545; }
  .icono { font-size: 44px; line-height: 1; }
  .titulo { font-size: 20px; font-weight: 800; margin: 8px 0 4px; }
  .si .titulo { color: #146c43; } .no .titulo { color: #b02a37; }
  .motivo { font-size: 14px; color: #374151; margin: 0 0 14px; }
  .datos { background: #fff; border-radius: 10px; text-align: left; font-size: 14px; }
  .fila { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-bottom: 1px solid #f1f1f1; }
  .fila:last-child { border-bottom: 0; }
  .fila span { color: #6b7280; } .fila strong { color: #111827; text-align: right; }
</style>
</head>
<body>
<div class="caja">
  <h1>Verificar Membresía</h1>
  <p class="sub">Ingrese la cédula del usuario</p>

  <form id="form">
    <input id="cedula" type="text" inputmode="numeric" autocomplete="off" placeholder="Ej: 12345678" required>
    <button id="btn" type="submit">Buscar</button>
  </form>

  <div id="cargando" class="cargando"><div class="spinner"></div>Consultando...</div>
  <div id="error" class="error"></div>

  <div id="resultado" class="resultado">
    <div class="icono" id="icono"></div>
    <div class="titulo" id="titulo"></div>
    <p class="motivo" id="motivo"></p>
    <div class="datos">
      <div class="fila"><span>Cédula</span><strong id="rCedula"></strong></div>
      <div class="fila"><span>Nombre</span><strong id="rNombre"></strong></div>
      <div class="fila"><span>Plan en la app</span><strong id="rPlan"></strong></div>
      <div class="fila" id="filaFecha"><span>Vence</span><strong id="rFecha"></strong></div>
    </div>
  </div>
</div>

<script>
  // ==========================================================
  // CONFIGURACIÓN: pegue aquí la URL de su aplicación web de Apps Script (termina en /exec)
  // ==========================================================
  const BACKEND_URL = "PEGAR_AQUI_URL_EXEC";

  const $ = id => document.getElementById(id);

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const cedula = String($('cedula').value || "").replace(/\D/g, "");
    if (cedula.length < 5 || cedula.length > 10) return mostrarError("Ingrese una cédula válida (solo números).");
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(BACKEND_URL)) return mostrarError("Falta configurar la URL del backend.");

    $('resultado').style.display = 'none';
    $('error').style.display = 'none';
    $('cargando').style.display = 'block';
    $('btn').disabled = true;

    try {
      // credentials: "omit" -> no se envía la sesión de Google del visitante
      // (evita el error de "varias cuentas" sin necesidad de ventana privada)
      const resp = await fetch(BACKEND_URL + "?cedula=" + encodeURIComponent(cedula), { credentials: "omit", redirect: "follow" });
      if (!resp.ok) throw new Error("El servicio no respondió (" + resp.status + "). Intente de nuevo.");
      const r = await resp.json();
      if (!r || r.ok === false) throw new Error((r && r.error) || "No se pudo consultar. Intente de nuevo.");
      mostrarResultado(r);
    } catch (err) {
      mostrarError(err instanceof TypeError ? "No hay conexión con el servicio. Intente de nuevo." : err.message);
    } finally {
      $('cargando').style.display = 'none';
      $('btn').disabled = false;
    }
  });

  function mostrarResultado(r) {
    const caja = $('resultado');
    caja.className = 'resultado ' + (r.tieneMembresia ? 'si' : 'no');
    $('icono').textContent = r.tieneMembresia ? '✅' : '❌';
    $('titulo').textContent = r.tieneMembresia ? 'TIENE MEMBRESÍA' : 'SIN MEMBRESÍA';
    $('motivo').textContent = r.motivo;
    $('rCedula').textContent = r.cedula;
    $('rNombre').textContent = r.nombre || '—';
    $('rPlan').textContent = r.membresiaOriginal;
    $('rFecha').textContent = r.fechaFin;
    $('filaFecha').style.display = r.fechaFin ? 'flex' : 'none';
    caja.style.display = 'block';
    $('cedula').select();
  }

  function mostrarError(msg) {
    $('error').textContent = msg;
    $('error').style.display = 'block';
  }
</script>
</body>
</html>
